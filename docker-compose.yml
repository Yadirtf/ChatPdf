# Modo recomendado: solo la base de datos en Docker; la app y los modelos corren en tu PC.
#
#   docker compose up -d          → PostgreSQL 16 + pgvector 0.8 en localhost:5433
#
# Opcional:
#   docker compose --profile app up -d --build
#       también la app en Docker. Usa el llama.cpp / Ollama de tu PC vía host.docker.internal
#       y lee la carpeta ./conocimiento.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: astrolabio
      POSTGRES_PASSWORD: astrolabio
      POSTGRES_DB: astrolabio
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      - astrolabio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrolabio"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # ---- Opcional: la app dentro de Docker (perfil "app") ----
  app:
    build: .
    profiles: [app]
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro del contenedor "localhost" es el propio contenedor. Las URLs de modelos que
      # apuntan a localhost se traducen solas a host.docker.internal.
      DATABASE_URL: postgresql://astrolabio:astrolabio@db:5432/astrolabio
      KNOWLEDGE_DIR: /conocimiento
      # En carpetas montadas desde Windows o macOS los eventos de archivos no llegan al contenedor.
      SCAN_INTERVAL: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conocimiento:/conocimiento
      - whisper-models:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  astrolabio-pgdata:
  whisper-models:
