# Modo recomendado: solo la base de datos en Docker; la app y Ollama corren en tu PC.
#
#   docker compose up -d          → PostgreSQL + pgvector en localhost:5433
#
# Perfiles opcionales:
#   docker compose --profile app up -d --build
#       también la app en Docker (usa el Ollama de tu PC vía host.docker.internal)
#   DOCKER_OLLAMA_URL=http://ollama:11434 docker compose --profile app --profile ollama up -d --build
#       todo en Docker, incluido Ollama

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatpdf
      POSTGRES_PASSWORD: chatpdf
      POSTGRES_DB: chatpdf
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpdf"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # ---- Opcional: la app dentro de Docker (perfil "app") ----
  app:
    build: .
    profiles: [app]
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro del contenedor "localhost" es el propio contenedor: estas dos variables
      # pisan las de .env, que apuntan a localhost para el modo local.
      DATABASE_URL: postgresql://chatpdf:chatpdf@db:5432/chatpdf
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Opcional: Ollama dentro de Docker (perfil "ollama") ----
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      # 11435 en tu PC para no chocar con un Ollama local en 11434
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    # Con GPU NVIDIA, descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Descarga una sola vez los modelos de chat y embeddings en el Ollama de Docker.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 3 && ollama pull ${OLLAMA_CHAT_MODEL:-gemma4:e2b} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    restart: "no"

volumes:
  pgdata:
  ollama:
