# Por defecto la app usa el Ollama que ya tienes instalado en tu PC.
# Dentro de un contenedor "localhost" es el propio contenedor, por eso se
# llega a tu PC con host.docker.internal y no con localhost.
#
# ¿No tienes Ollama instalado? Levanta también el de Docker:
#   DOCKER_OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up -d --build
# (o pon DOCKER_OLLAMA_URL en .env y usa --profile ollama)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatpdf
      POSTGRES_PASSWORD: chatpdf
      POSTGRES_DB: chatpdf
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpdf"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Estas dos variables pisan las de .env, que apuntan a localhost para el modo sin Docker.
      DATABASE_URL: postgresql://chatpdf:chatpdf@db:5432/chatpdf
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Opcional: Ollama dentro de Docker (perfil "ollama") ----
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      # 11435 en tu PC para no chocar con un Ollama local en 11434
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    # Con GPU NVIDIA, descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Descarga una sola vez los modelos de chat y embeddings en el Ollama de Docker.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 3 && ollama pull ${OLLAMA_CHAT_MODEL:-gemma4:e2b} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    restart: "no"

volumes:
  pgdata:
  ollama:
